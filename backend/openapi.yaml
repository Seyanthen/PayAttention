openapi: 3.0.3
info:
  title: Pay Attention API
  version: 1.0.0
  description: Financial tracking and budgeting API. Money uses integer minor units.
servers:
  - url: http://localhost:8000/api/v1
  - url: http://localhost:8000/api
security:
  - tokenAuth: []
paths:
  /health/:
    get:
      security: []
      responses:
        '200': {description: API is healthy}
  /auth/token/:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {description: Authentication token}
        '400': {description: Invalid credentials}
  /accounts/:
    get:
      description: Returns only accounts owned by the authenticated user.
      responses:
        '200': {description: User-owned accounts}
        '401': {description: Authentication required}
    post:
      description: Creates an account owned by the authenticated user.
      responses:
        '201': {description: Account created}
        '400': {description: Invalid account data}
        '401': {description: Authentication required}
  /accounts/{id}/:
    get:
      description: Returns an account owned by the authenticated user.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Account details}
        '401': {description: Authentication required}
        '404': {description: Account not found}
    put:
      description: Replaces an account owned by the authenticated user.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Account updated}
        '400': {description: Invalid account data}
        '401': {description: Authentication required}
        '404': {description: Account not found}
    delete:
      description: Deletes an account owned by the authenticated user.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Account deleted}
        '401': {description: Authentication required}
        '404': {description: Account not found}
  /categories/:
    get: {responses: {'200': {description: User-owned categories}}}
    post: {responses: {'201': {description: Category created}}}
  /categories/{id}/:
    get: {responses: {'200': {description: Category details}, '404': {description: Category not found}}}
    put: {responses: {'200': {description: Category updated}, '400': {description: Invalid category data}}}
    delete: {responses: {'204': {description: Category deleted}, '404': {description: Category not found}}}
  /recurring-transactions/:
    get:
      description: Returns recurring transactions owned by the authenticated user. The default and active=true return active records only; active=false returns inactive records; active=all returns both.
      parameters:
        - name: active
          in: query
          required: false
          schema: {type: string, enum: [true, false, all], default: true}
      responses:
        '200': {description: Deterministically ordered recurring transactions}
        '400': {description: Invalid active filter}
        '401': {description: Authentication required}
    post:
      description: Creates an owned recurring transaction. Money is an integer number of minor units and dates use ISO YYYY-MM-DD format.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecurringTransactionInput'}
      responses:
        '201': {description: Recurring transaction created}
        '400': {description: Invalid recurring transaction data}
        '401': {description: Authentication required}
  /recurring-transactions/{id}/:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      description: Returns an owned recurring transaction.
      responses: {'200': {description: Recurring transaction}, '401': {description: Authentication required}, '404': {description: Not found}}
    patch:
      description: Updates an owned recurring transaction, including is_active for deactivation or reactivation.
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecurringTransactionInput'}
      responses: {'200': {description: Updated recurring transaction}, '400': {description: Invalid data}, '401': {description: Authentication required}, '404': {description: Not found}}
    delete:
      description: Deletes an owned recurring transaction.
      responses: {'204': {description: Recurring transaction deleted}, '401': {description: Authentication required}, '404': {description: Not found}}
  /recurring-transactions/{id}/advance/:
    post:
      description: Advances an active owned schedule by one frequency interval. This updates next_occurrence only and does not create a posted transaction. Monthly dates preserve the day when possible and clamp to the target month's last day. Calendar dates are interpreted as date-only UTC business dates.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Schedule advanced}
        '400': {description: Inactive schedule or unsupported frequency}
        '401': {description: Authentication required}
        '404': {description: Not found}
  /transactions/:
    get:
      description: Returns only transactions owned by the authenticated user.
      responses:
        '200': {description: User-owned transactions}
        '401': {description: Authentication required}
    post:
      description: Creates a transaction using only the authenticated user's related records.
      responses:
        '201': {description: Transaction created}
        '400': {description: Invalid transaction data}
        '401': {description: Authentication required}
  /transactions/{id}/:
    get:
      description: Returns a transaction owned by the authenticated user.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Transaction details}
        '401': {description: Authentication required}
        '404': {description: Transaction not found}
    put:
      description: Replaces a transaction owned by the authenticated user.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Transaction updated}
        '400': {description: Invalid transaction data}
        '401': {description: Authentication required}
        '404': {description: Transaction not found}
    delete:
      description: Deletes a transaction owned by the authenticated user.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Transaction deleted}
        '401': {description: Authentication required}
        '404': {description: Transaction not found}
  /budgets/:
    get: {responses: {'200': {description: User-owned budgets}}}
    post: {responses: {'201': {description: Budget created}}}
  /budgets/current/:
    get:
      description: Returns budgets overlapping the current calendar month with spending totals.
      responses:
        '200': {description: Current-month budgets}
        '401': {description: Authentication required}
  /budgets/{month}/:
    get:
      description: Returns budgets overlapping a month in YYYY-MM format with spending totals.
      parameters:
        - {name: month, in: path, required: true, schema: {type: string, pattern: '^\\d{4}-\\d{2}$'}}
      responses:
        '200': {description: Monthly budgets}
        '400': {description: Invalid month format}
        '401': {description: Authentication required}
  /summary/:
    get:
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Expense totals by category}
        '400': {description: Invalid date range}
  /summary/current-month/:
    get:
      description: Returns expense totals grouped by category for the current calendar month.
      responses:
        '200': {description: Current-month expense summary}
        '401': {description: Authentication required}
  /goals/:
    get:
      description: Returns goals owned by the authenticated user with progress calculated from contributions.
      responses:
        '200': {description: User-owned goals}
        '401': {description: Authentication required}
    post:
      description: Creates a goal owned by the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoalInput'}
      responses:
        '201': {description: Goal created}
        '400': {description: Invalid goal data}
        '401': {description: Authentication required}
  /goals/{id}/:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: Goal with calculated progress}, '401': {description: Authentication required}, '404': {description: Goal not found}}
    patch:
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: Updated goal}, '400': {description: Invalid goal data}, '401': {description: Authentication required}}
    delete:
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses: {'204': {description: Goal deleted}, '401': {description: Authentication required}}
  /reports/monthly/:
    get:
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Calendar-month income, expenses, and net cash flow in integer minor units}
        '400': {description: Invalid or reversed date range}
        '401': {description: Authentication required}
  /reports/categories/:
    get:
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Expense totals grouped by category, including Uncategorized}
        '400': {description: Invalid or reversed date range}
        '401': {description: Authentication required}
  /reports/cash-flow/:
    get:
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Income, expenses, and net cash flow excluding transfers}
        '400': {description: Invalid or reversed date range}
        '401': {description: Authentication required}
  /reports/budget-performance/:
    get:
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Applicable budgets with limit, spent, remaining, percentage used, and over-budget status}
        '400': {description: Invalid or reversed date range}
        '401': {description: Authentication required}
components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Use the format `Token <token>`.
  schemas:
    GoalInput:
      type: object
      required: [name, target_amount_minor, target_date]
      properties:
        name: {type: string}
        target_amount_minor: {type: integer, minimum: 1, description: Integer minor currency units}
        target_date: {type: string, format: date}
        currency: {type: string, minLength: 3, maxLength: 3, example: USD}
        is_completed: {type: boolean}
    Goal:
      allOf:
        - {$ref: '#/components/schemas/GoalInput'}
        - type: object
          properties:
            id: {type: integer}
            current_amount_minor: {type: integer}
            remaining_amount_minor: {type: integer}
            progress_percent: {type: number, format: double}
    RecurringTransactionInput:
      type: object
      required: [name, amount_minor, transaction_type, frequency, next_occurrence]
      properties:
        name: {type: string, maxLength: 160}
        amount_minor: {type: integer, minimum: 1, description: Integer minor currency units; never floating point}
        transaction_type: {type: string, enum: [income, expense]}
        frequency: {type: string, enum: [weekly, biweekly, monthly]}
        next_occurrence: {type: string, format: date, description: ISO YYYY-MM-DD calendar date}
        is_active: {type: boolean, default: true}
        currency: {type: string, minLength: 3, maxLength: 3, example: USD}
    RecurringTransaction:
      allOf:
        - {$ref: '#/components/schemas/RecurringTransactionInput'}
        - type: object
          properties:
            id: {type: integer}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}

