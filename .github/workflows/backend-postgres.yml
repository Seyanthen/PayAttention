name: Backend PostgreSQL verification

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-postgres.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pay_attention_test
          POSTGRES_USER: pay_attention
          POSTGRES_PASSWORD: pay_attention_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pay_attention -d pay_attention_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      DJANGO_DEBUG: "0"
      POSTGRES_DB: pay_attention_test
      POSTGRES_USER: pay_attention
      POSTGRES_PASSWORD: pay_attention_ci_only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      POSTGRES_CHANNEL_BINDING: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py test
