services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
